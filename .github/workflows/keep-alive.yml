name: Keep Render API warm

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping APIs
        run: |
          for url in \
            https://picos-a6fx.onrender.com/ \
            https://get-log-files.onrender.com/ \
            https://granco-monitor.onrender.com/ \
          ; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$url")
            echo "$url -> $code"
          done
